name: 클로드 초기화 알림

# 5시간 사용량이 초기화되는 시각에 Haiku로 짧은 메시지를 보내 새 창을 시작하고, 카카오톡으로 알린다.
# 공개 저장소에서는 실행 하나가 다음 초기화 시각까지 기다렸다가 보내고, 다음 실행을 스스로 이어 붙인다.
# 아래 예약 실행은 그 이어 붙이기가 끊겼을 때 다시 시작하기 위한 안전장치다.
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
    inputs:
      send_now:
        description: '초기화 시각을 기다리지 않고 지금 바로 보내기'
        type: boolean
        default: false
      test_only:
        description: '시험 모드 (카톡 없이 모델과 토큰 수만 확인)'
        type: boolean
        default: false

permissions:
  actions: write   # 다음 실행을 이어 붙이기 위해
  contents: read

jobs:
  prime:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    # 한 번에 하나만 돌고, 대기 중인 실행은 가장 최근 것 하나만 남는다
    concurrency:
      group: claude-prime
    steps:
      - uses: actions/checkout@v4

      - name: 초기화 시각까지 기다렸다가 Haiku 메시지, 카카오톡 알림
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SEND_NOW: ${{ inputs.send_now }}
          TEST_ONLY: ${{ inputs.test_only }}
        run: node claude-prime.js
