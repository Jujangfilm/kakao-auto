name: 클로드 초기화 알림

on:
  schedule:
    - cron: '*/15 * * * *'   # 15분마다 확인 (알릴 게 없으면 작업을 건너뛰어 사용 시간이 들지 않음)
  workflow_dispatch:

jobs:
  notify:
    # PC가 올린 초기화 시각이 있고, 아직 알리지 않았을 때만 실행
    if: vars.CLAUDE_RESET_AT != '' && vars.CLAUDE_RESET_AT != vars.CLAUDE_RESET_SENT
    runs-on: ubuntu-latest
    concurrency:
      group: claude-reset
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 초기화 시각 확인 및 알림
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node claude-reset-check.js
